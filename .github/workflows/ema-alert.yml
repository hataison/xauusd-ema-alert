name: XAUUSD EMA cross alert

on:
  schedule:
    # Every 5 minutes from 00:00 to 14:55 UTC, plus 15:00 UTC.
    # = 07:00 to 22:00 Bangkok time (UTC+7), Monday to Friday.
    - cron: "*/5 0-14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:      # lets you run it by hand from the Actions tab
    inputs:
      test:
        description: "Send a test status message instead of checking for a cross"
        type: boolean
        default: false

permissions:
  contents: write         # only used to save state.json (the record of the last alert)

concurrency:
  group: ema-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for EMA cross
        run: python3 ema_alert.py
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_TEST: ${{ github.event.inputs.test }}

      - name: Save state if it changed
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "ema-alert-bot"
            git config user.email "ema-alert-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update alert state"
            git push
          fi
